<style>
  :root {
    --bg: #f8f6f2;
    --off: #f1ece5;
    --card: #ffffff;
    --card2: #f7f4ef;
    --border: #e6ddd2;
    --muted: #6f6a66;
    --mid: #8b8480;
    --light: #b7b0aa;
    --white: #1f1a1f;
    --accent: #4b1f6f;
    --green: #4b1f6f;
    --gold: #7a4aa6;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    background: var(--bg);
    color: var(--white);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.6;
    overflow-x: hidden;
    cursor: none;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle, rgba(75,31,111,0.04) 0.8px, transparent 0.8px);
    background-size: 14px 14px;
    pointer-events: none;
    z-index: 9000;
    opacity: 0.25;
  }

  .cursor {
    position: fixed;
    top: 0;
    left: 0;
    width: 12px;
    height: 12px;
    background: var(--accent);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: transform .15s, background .2s;
  }

  .cursor-ring {
    position: fixed;
    top: 0;
    left: 0;
    width: 36px;
    height: 36px;
    border: 1px solid rgba(75,31,111,.25);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
    transition: transform .35s ease, width .2s, height .2s;
  }

  nav.scrolled {
    background: rgba(248,246,242,.96);
    border-color: var(--border);
    backdrop-filter: blur(16px);
    padding: 14px 48px;
  }

  .nav-logo span,
  .hero-headline em,
  .section-label,
  .price-features li::before {
    color: var(--accent);
  }

  .btn-primary,
  .nav-cta,
  .form-submit,
  .band-btn {
    background: var(--accent);
    color: #fff;
  }

  .btn-primary:hover,
  .nav-cta:hover,
  .form-submit:hover,
  .band-btn:hover {
    background: #3d155b;
  }

  .hero-bg {
    background: radial-gradient(ellipse 70% 60% at 75% 35%, rgba(75,31,111,.08) 0%, transparent 70%),
                radial-gradient(ellipse 50% 50% at 15% 85%, rgba(75,31,111,.04) 0%, transparent 60%);
  }

  .marquee-wrap,
  .services,
  .contact,
  .process {
    background: var(--off);
  }

  .service-card,
  .price-card,
  .process-step,
  .work-item {
    background: var(--card);
  }

  .loader {
    position: fixed;
    inset: 0;
    background: #f8f6f2;
    z-index: 99999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }

  .loader-logo {
    font-family: Bebas Neue, sans-serif;
    font-size: 48px;
    letter-spacing: 4px;
    color: #1f1a1f;
  }

  .loader-logo span {
    color: var(--accent);
  }

  .loader-bar-wrap {
    width: 200px;
    height: 2px;
    background: #e6ddd2;
    border-radius: 2px;
    overflow: hidden;
  }

  .loader-bar {
    height: 100%;
    width: 0;
    background: var(--accent);
    border-radius: 2px;
    animation: loadBar 1.6s ease forwards;
  }

  .loader-text {
    font-family: DM Mono, monospace;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #6f6a66;
  }

  .nav-logo,
  .hero-headline,
  .section-title,
  .service-card h3,
  .price-name,
  .band-title,
  .contact-headline {
    color: #1f1a1f;
  }

  .nav-links a,
  .hero-sub,
  .service-card p,
  .price-desc,
  .step-desc,
  .contact-sub,
  .band-desc,
  .footer-copy {
    color: #6f6a66;
  }

  .work-overlay-dark {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(255,255,255,.88) 0, rgba(75,31,111,.12) 60%, rgba(255,255,255,.05) 100%);
    z-index: 1;
    transition: background .4s;
  }

  .work-arrow {
    border: 1px solid rgba(31,26,31,.15);
    color: #1f1a1f;
  }

  .price-card.featured {
    background: var(--green);
  }

  .price-card.featured .price-name,
  .price-card.featured .price-amount,
  .price-card.featured .price-period,
  .price-card.featured .price-desc,
  .price-card.featured .price-features li,
  .price-card.featured .price-num {
    color: #1f1a1f;
  }

  .price-card.featured .price-divider {
    background: rgba(0,0,0,.15);
  }

  .stat-num {
    color: #1f1a1f;
  }

  .stat-label,
  .footer-links a,
  .footer-copy {
    color: #6f6a66;
  }

  .footer {
    border-top: 2px solid var(--accent);
    background: #f1ece5;
  }

  .back-top {
    background: var(--card2);
    border: 1px solid var(--border);
    color: #1f1a1f;
  }

  .back-top:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .whatsapp-btn {
    background: #4b1f6f;
  }

  .whatsapp-btn svg {
    fill: #fff;
  }

  .nav-hamburger span {
    background: #1f1a1f;
  }

  .contact-glow,
  .pricing-glow {
    pointer-events: none;
  }

  .hero-headline em {
    font-style: normal;
    display: block;
  }
</style>
